version: '3.9'

# ══════════════════════════════════════════════════════════════════════════════
# CEVI Hospital Registry — Production Docker Compose Architecture
#
# Services:
#   db       → MySQL 8 (internal network only — no host ports)
#   backend  → Node.js 20 Express API + Prisma ORM (internal network only)
#   frontend → Nginx HTTPS reverse proxy (port 80 redirect + 443 HTTPS)
#
# Network topology:
#   frontend ──[frontend_net]──► backend ──[backend_net, internal]──► db
#   frontend has NO direct route to db.
#
# Secrets:
#   All credentials must be set in the .env file on the server.
#   Use: cp .env.example .env && openssl rand -hex 32 (for each secret).
#   The compose file carries NO default credentials — startup fails fast if
#   any required variable is missing.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cevi_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — set it in .env}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:?MYSQL_DATABASE is required — set it in .env}
      MYSQL_USER:          ${MYSQL_USER:?MYSQL_USER is required — set it in .env}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required — set it in .env}
    # NO host ports — MySQL is strictly isolated to backend_net (internal)
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO
    volumes:
      - cevi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  # ── Backend (Node.js API) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cevi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      JWT_SECRET:      "${JWT_SECRET:?JWT_SECRET is required — generate with: openssl rand -hex 32}"
      PORT:            3002
      NODE_ENV:        production
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://10.0.11.244,http://10.0.11.244}"
    # NO host ports — backend is only reachable via Nginx reverse proxy
    volumes:
      - cevi_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # ── Frontend (Nginx HTTPS Reverse Proxy) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://10.0.11.244/api}"
    container_name: cevi_frontend
    restart: unless-stopped
    ports:
      # Bind explicitly to the hospital server IP — not 0.0.0.0
      - "${SERVER_IP:-10.0.11.244}:80:80"    # HTTP → redirects to HTTPS
      - "${SERVER_IP:-10.0.11.244}:443:443"  # HTTPS (TLS 1.2/1.3)
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - frontend_net

# ── Persisted Named Volumes ───────────────────────────────────────────────────
volumes:
  cevi_mysql_data:
    driver: local
  cevi_storage:
    driver: local

# ── Docker Networks ───────────────────────────────────────────────────────────
networks:
  # frontend_net: frontend ↔ backend only
  frontend_net:
    driver: bridge

  # backend_net: backend ↔ db only — marked internal so containers on this
  # network have no default gateway and cannot initiate outbound connections.
  backend_net:
    driver: bridge
    internal: true
