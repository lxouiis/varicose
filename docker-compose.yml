version: '3.9'

# ══════════════════════════════════════════════════════════════════════════════
# CEVI Hospital Registry — Production Docker Compose Architecture
#
# Services:
#   db       → MySQL 8 (Isolated internal container, NO host ports)
#   backend  → Node.js 20 Express API + Prisma ORM (Internal network only)
#   frontend → Nginx HTTPS reverse proxy (Port 80 HTTP -> Port 443 HTTPS)
#
# Production Security Features:
#   - Database and Backend ports are NOT exposed to LAN
#   - /storage is NOT directly exposed; all file access requires JWT authentication
#   - Credentials read from .env (generated via openssl rand -hex 32)
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cevi_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword_change_me}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-cevi_db}
      MYSQL_USER:          ${MYSQL_USER:-cevi_app}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-CeviHospital_2026_SecureKey}
    # ⚠️ NO host ports mapping — MySQL is strictly isolated to internal Docker network cevi_net
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO
    volumes:
      - cevi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-cevi_app}", "-p${MYSQL_PASSWORD:-CeviHospital_2026_SecureKey}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cevi_net

  # ── Backend (Node.js API) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cevi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    "mysql://${MYSQL_USER:-cevi_app}:${MYSQL_PASSWORD:-CeviHospital_2026_SecureKey}@db:3306/${MYSQL_DATABASE:-cevi_db}"
      JWT_SECRET:      "${JWT_SECRET:-cevi-jnmc-hospital-prod-secret-2026-CHANGE-THIS}"
      PORT:            3002
      NODE_ENV:        production
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://192.168.1.100,http://192.168.1.100}"
    # ⚠️ NO host ports mapping — Backend port 3002 is ONLY accessible via Nginx reverse proxy
    volumes:
      - cevi_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cevi_net

  # ── Frontend (Nginx HTTPS Reverse Proxy) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://192.168.1.100/api}"
    container_name: cevi_frontend
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (Auto-redirects to HTTPS 443)
      - "443:443"    # HTTPS (TLS 1.2 / 1.3 Encrypted Traffic)
    volumes:
      # SSL Certificates directory (Generated via scripts/generate-ssl.sh)
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - cevi_net

# ── Persisted Named Volumes ───────────────────────────────────────────────────
volumes:
  cevi_mysql_data:
    driver: local
  cevi_storage:
    driver: local

# ── Internal Docker Bridge Network ───────────────────────────────────────────
networks:
  cevi_net:
    driver: bridge
