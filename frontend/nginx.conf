# ══════════════════════════════════════════════════════════════════════════════
# CEVI Hospital Registry — Nginx Production Config (HTTPS + Intranet)
# ══════════════════════════════════════════════════════════════════════════════

# 1. HTTP Server — Auto-redirects all unencrypted HTTP traffic to HTTPS (Port 443)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server — Secure SSL/TLS Endpoints
server {
    listen 443 ssl http2;
    server_name _;

    # SSL Certificates (Generated via scripts/generate-ssl.sh or provided by Hospital IT)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # SSL Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Router — all SPA routes served via index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* requests to Node.js backend container
    # NOTE: All file downloads go through /api/files/... which enforces JWT auth!
    # Direct unauthenticated /storage access is REMOVED for patient privacy.
    location /api/ {
        proxy_pass         http://backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Max upload limit for DICOM/PDF Doppler material
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
