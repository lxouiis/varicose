server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* requests to the backend container
    location /api/ {
        proxy_pass         http://backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded patient files (images, doppler PDFs) from backend volume
    location /storage/ {
        proxy_pass http://backend:3002/storage/;
    }

    # Max upload size for doppler PDFs / DICOM
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
